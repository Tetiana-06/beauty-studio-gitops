# Application для Loki в режимі одного процесу (singleBinary)
# ЛР-7 п. 1: Збір і збереження логів
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.27.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          useTestSchema: true
        singleBinary:
          replicas: 1
          persistence:
            enabled: false
          # Без persistence чарт не монтує том у /var/loki, а коренева ФС
          # контейнера read-only -> "mkdir /var/loki: read-only file system".
          # Даємо Loki тимчасовий записуваний каталог (дані живуть, поки живе под).
          extraVolumes:
            - name: data
              emptyDir: {}
          extraVolumeMounts:
            - name: data
              mountPath: /var/loki
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
