# DVO-L4-3C8B52
# Default values for beauty-studio chart.
# This represents the development environment defaults.

nameOverride: ""
fullnameOverride: ""

# Backend service configuration
backend:
  replicaCount: 1
  image:
    repository: beauty-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 150m
      memory: 128Mi
      ephemeral-storage: 256Mi
  config:
    appEnv: "development"
    port: "8000"
    logLevel: "debug"
    corsAllowAll: "true"
    failRate: "0.0"         # ЛР-7 п. 6b: частка помилок (0.0 = немає)

  # ЛР-6, ЛР-7: Argo Rollouts замість Deployment.
  rollout:
    enabled: false          # true -> створюється Rollout, Deployment не створюється
    canary:
      # Без service mesh вага задається кількістю подів: при 4 репліках 25% = 1 под нової версії.
      steps:
        - setWeight: 25
        - pause: { duration: 30s }  # ЛР-7: даємо canary-поду 30 с трафіку, щоб помилки встигли потрапити в метрики
        - analysis:                 # ЛР-7 п. 6a: перевірка частки успішних запитів у Prometheus
            templates:
              - templateName: beauty-studio-success-rate
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 75
        - pause: { duration: 30s }
        # після останнього кроку автоматично 100%

# Frontend service configuration
frontend:
  replicaCount: 1
  image:
    repository: beauty-frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

# PostgreSQL database configuration
database:
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "15-alpine"
  service:
    type: ClusterIP
    port: 5432
  auth:
    username: "user"
    password: ""
    database: "beauty_db"
    existingSecret: ""
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 256Mi

# Ingress controller configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: "beauty.local"
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend

# ЛР-7: Observability (ServiceMonitor, дашборд, AnalysisTemplate, PrometheusRule)
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 10s

dashboard:
  enabled: true

analysis:
  enabled: true
  threshold: 0.95           # поріг: не менше 95% успішних запитів
  count: 3
  interval: 10s
  failureLimit: 0
  prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"

prometheusRule:
  enabled: true
